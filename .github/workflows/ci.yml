name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Development happens on Windows, so Linux is the side that would silently
    # rot: the build-tagged files (terminate_unix.go, secure_unix.go) are never
    # compiled locally. This is what keeps them honest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test under the race detector
        # Only on Linux: on Windows -race needs cgo and a C compiler, which is
        # exactly the local friction this job exists to remove.
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
